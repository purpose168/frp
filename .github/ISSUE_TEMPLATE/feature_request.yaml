name: 功能请求
description: 提出改进 frp 的想法
title: "[功能请求] "

body:
- type: markdown
  attributes:
    value: |
      此模板仅用于请求新产品功能。
- type: textarea
  id: feature-request
  attributes:
    label: 描述功能请求
    description: 告诉我们您想要什么以及为什么应该在 frp 中添加它。
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: 描述您考虑过的替代方案
- type: checkboxes
  id: area
  attributes:
    label: 受影响的区域
    options:
    - label: "文档"
    - label: "安装"
    - label: "性能和可扩展性"
    - label: "安全性"
    - label: "用户体验"
    - label: "测试和发布"
    - label: "开发者基础设施"
    - label: "客户端插件"
    - label: "服务器插件"
    - label: "扩展"
    - label: "其他"
