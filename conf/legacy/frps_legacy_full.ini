# [common] 是必需的配置段
[common]
# IPv6 的字面地址或主机名必须用方括号括起来
# 如 "[::1]:80"、"[ipv6-host]:http" 或 "[ipv6-host%zone]:80"
# 对于单个 "bind_addr" 字段，不需要方括号，如 "bind_addr = ::"
bind_addr = 0.0.0.0
bind_port = 7000

# 用于 kcp 协议的 udp 端口，可以与 'bind_port' 相同
# 如果未设置，frps 中禁用 kcp
kcp_bind_port = 7000

# 用于 quic 协议的 udp 端口
# 如果未设置，frps 中禁用 quic
# quic_bind_port = 7002
# quic 协议选项
# quic_keepalive_period = 10
# quic_max_idle_timeout = 30
# quic_max_incoming_streams = 100000

# 指定代理将监听哪个地址，默认值与 bind_addr 相同
# proxy_bind_addr = 127.0.0.1

# 如果要支持虚拟主机，必须设置 http 监听端口（可选）
# 注意：http 端口和 https 端口可以与 bind_port 相同
vhost_http_port = 80
vhost_https_port = 443

# vhost http 服务器的响应头超时（秒），默认为 60s
# vhost_http_timeout = 60

# tcpmux_httpconnect_port 指定服务器监听 TCP HTTP CONNECT 请求的端口
# 如果值为 0，服务器不会在单个端口上多路复用 TCP 请求
# 如果不为 - 它将在此值上监听 HTTP CONNECT 请求
# 默认情况下，此值为 0
# tcpmux_httpconnect_port = 1337

# 如果 tcpmux_passthrough 为 true，frps 不会对流量进行任何更新
# tcpmux_passthrough = false

# 设置 dashboard_addr 和 dashboard_port 以查看 frps 的仪表板
# dashboard_addr 的默认值与 bind_addr 相同
# 仅当设置了 dashboard_port 时，仪表板才可用
dashboard_addr = 0.0.0.0
dashboard_port = 7500

# 仪表板用户和密码，用于基本身份验证保护
dashboard_user = admin
dashboard_pwd = admin

# 仪表板 TLS 模式
dashboard_tls_mode = false
# dashboard_tls_cert_file = server.crt
# dashboard_tls_key_file = server.key

# enable_prometheus 将在 {dashboard_addr}:{dashboard_port} 的 /metrics api 上导出 prometheus 指标
enable_prometheus = true

# 仪表板资源目录（仅用于调试模式）
# assets_dir = ./static

# 控制台或实际的日志文件路径，如 ./frps.log
log_file = ./frps.log

# trace, debug, info, warn, error
log_level = info

log_max_days = 3

# 当 log_file 为控制台时禁用日志颜色，默认为 false
disable_log_color = false

# DetailedErrorsToClient 定义是否向 frpc 发送特定错误（包含调试信息）。默认情况下，此值为 true
detailed_errors_to_client = true

# authentication_method 指定使用什么身份验证方法来验证 frpc 与 frps
# 如果指定 "token" - 将读取令牌到登录消息中
# 如果指定 "oidc" - 将使用 OIDC 设置颁发 OIDC（Open ID Connect）令牌。默认情况下，此值为 "token"
authentication_method = token

# authenticate_heartbeats 指定是否在发送到 frps 的心跳中包含身份验证令牌。默认情况下，此值为 false
authenticate_heartbeats = false

# AuthenticateNewWorkConns 指定是否在发送到 frps 的新工作连接中包含身份验证令牌。默认情况下，此值为 false
authenticate_new_work_conns = false

# 身份验证令牌
token = 12345678

# oidc_issuer 指定用于验证 OIDC 令牌的颁发者
# 默认情况下，此值为 ""
oidc_issuer =

# oidc_audience 指定在验证时 OIDC 令牌应包含的受众
# 默认情况下，此值为 ""
oidc_audience =

# oidc_skip_expiry_check 指定是否跳过检查 OIDC 令牌是否过期
# 默认情况下，此值为 false
oidc_skip_expiry_check = false

# oidc_skip_issuer_check 指定是否跳过检查 OIDC 令牌的颁发者声明是否与 OidcIssuer 中指定的颁发者匹配
# 默认情况下，此值为 false
oidc_skip_issuer_check = false

# 心跳配置，不建议修改默认值
# heartbeat_timeout 的默认值为 90。设置负值以禁用它
# heartbeat_timeout = 90

# user_conn_timeout 配置，不建议修改默认值
# user_conn_timeout 的默认值为 10
# user_conn_timeout = 10

# 仅允许 frpc 绑定您列出的端口，如果未设置任何内容，则不会有任何限制
allow_ports = 2000-3000,3001,3003,4000-50000

# 每个代理中的 pool_count 如果超过最大值将更改为 max_pool_count
max_pool_count = 5

# 每个客户端可以使用的最大端口数，默认值为 0 表示无限制
max_ports_per_client = 0

# tls_only 指定是否仅接受 TLS 加密的连接。默认情况下，此值为 false
tls_only = false

# tls_cert_file = server.crt
# tls_key_file = server.key
# tls_trusted_ca_file = ca.crt

# 如果 subdomain_host 不为空，当 frpc 配置文件中的类型为 http 或 https 时，可以设置子域名
# 当子域名为 test 时，路由使用的主机为 test.frps.com
subdomain_host = frps.com

# 如果使用 tcp 流多路复用，默认为 true
# tcp_mux = true

# 指定 tcp mux 的保活间隔
# 仅在 tcp_mux 为 true 时有效
# tcp_mux_keepalive_interval = 60

# tcp_keepalive 指定 frpc 和 frps 之间活动网络连接的保活探测间隔
# 如果为负值，则禁用保活探测
# tcp_keepalive = 7200

# HTTP 请求的自定义 404 页面
# custom_404_page = /path/to/404.html

# 指定 udp 数据包大小，单位为字节。如果未设置，默认值为 1500
# 此参数在客户端和服务器之间应相同
# 它影响 udp 和 sudp 代理
udp_packet_size = 1500

# 在仪表板监听器中启用 golang pprof 处理程序
# 必须先设置仪表板端口
pprof_enable = false

# NAT 穿透策略数据的保留时间
nat_hole_analysis_data_reserve_hours = 168

[plugin.user-manager]
addr = 127.0.0.1:9000
path = /handler
ops = Login

[plugin.port-manager]
addr = 127.0.0.1:9001
path = /handler
ops = NewProxy
